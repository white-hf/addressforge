{% extends "base.html" %}

{% block content %}
<div class="panel">
    <div class="panel-head">
        <div class="flex justify-between items-center w-full">
            <div>
                <h2 data-i18n="nav_assets">资产与金标库</h2>
                <p data-i18n="nav_assets_desc">查看与修正已审核的数据</p>
            </div>
            <div class="flex gap-3">
                <input type="text" id="search-input" class="px-4 py-2 border rounded-xl w-64" placeholder="Search address..." onkeyup="handleSearch(event)">
                <button class="btn soft px-6" onclick="fetchAssets()">Search</button>
            </div>
        </div>
    </div>

    <div class="p-6">
        <table class="w-full text-left">
            <thead>
                <tr class="text-slate-400 text-xs uppercase font-bold border-b">
                    <th class="p-4">ID</th>
                    <th class="p-4">Raw Address</th>
                    <th class="p-4">Type</th>
                    <th class="p-4">Unit</th>
                    <th class="p-4">Score</th>
                    <th class="p-4">Actions</th>
                </tr>
            </thead>
            <tbody id="assets-table-body">
                <tr>
                    <td colspan="6" class="p-8 text-center text-slate-400">Loading data...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
        <div class="p-6 border-b bg-slate-50">
            <h3 class="text-xl font-bold" data-i18n="edit_label">修正金标数据</h3>
            <p class="text-xs text-slate-500 mt-1" id="modal-address-display">-</p>
        </div>
        <div class="p-8 flex flex-col gap-6">
            <input type="hidden" id="edit-id">
            
            <!-- Building Type Dropdown -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="building_type">建筑类型</label>
                <select id="edit-type" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" onchange="toggleUnitField()">
                    <option value="single_unit">Single Unit (House)</option>
                    <option value="multi_unit">Multi-Unit (Apt/Condo)</option>
                    <option value="commercial">Commercial/Business</option>
                </select>
            </div>

            <!-- Unit Number Input (Conditional) -->
            <div id="unit-field-container">
                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="unit_number">单元号</label>
                <input type="text" id="edit-unit" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 101, Unit B">
            </div>
        </div>
        <div class="p-6 bg-slate-50 border-t flex justify-end gap-3">
            <button class="btn soft px-6" onclick="closeModal()" data-i18n="cancel">取消</button>
            <button class="btn primary px-10" onclick="saveLabel()" data-i18n="save_changes">保存修改</button>
        </div>
    </div>
</div>

<script>
let currentAssets = [];

async function fetchAssets() {
    const q = document.getElementById('search-input').value;
    const res = await fetch(`/api/v1/business/gold-labels?q=${encodeURIComponent(q)}&limit=50`);
    currentAssets = await res.json();
    
    const tbody = document.getElementById('assets-table-body');
    if (!currentAssets || currentAssets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400">No records found.</td></tr>';
        return;
    }

    tbody.innerHTML = currentAssets.map(l => `
        <tr class="border-t hover:bg-slate-50">
            <td class="p-4 text-xs font-mono text-slate-400">${l.gold_label_id}</td>
            <td class="p-4 font-medium">${l.raw_address_text}</td>
            <td class="p-4">
                <span class="pill ${l.building_type === 'house' || l.building_type === 'single_unit' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}">
                    ${l.building_type}
                </span>
            </td>
            <td class="p-4 font-bold text-indigo-600">${l.suggested_unit_number || '-'}</td>
            <td class="p-4">${l.score || '-'}</td>
            <td class="p-4">
                <button class="btn soft py-1 px-3 text-xs" onclick="openEditModal(${l.gold_label_id})">Edit</button>
            </td>
        </tr>
    `).join('');
}

function handleSearch(e) {
    if (e.key === 'Enter') fetchAssets();
}

function toggleUnitField() {
    const type = document.getElementById('edit-type').value;
    const container = document.getElementById('unit-field-container');
    const input = document.getElementById('edit-unit');
    
    if (type === 'single_unit') {
        container.style.opacity = '0.3';
        input.disabled = true;
        input.value = '';
    } else {
        container.style.opacity = '1';
        input.disabled = false;
    }
}

function openEditModal(id) {
    const asset = currentAssets.find(a => a.gold_label_id === id);
    if (!asset) return;

    document.getElementById('edit-id').value = id;
    document.getElementById('modal-address-display').textContent = asset.raw_address_text;
    document.getElementById('edit-type').value = asset.building_type || 'single_unit';
    document.getElementById('edit-unit').value = asset.suggested_unit_number || '';
    
    toggleUnitField();
    document.getElementById('edit-modal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('edit-modal').classList.add('hidden');
}

async function saveLabel() {
    const id = document.getElementById('edit-id').value;
    const type = document.getElementById('edit-type').value;
    const unit = document.getElementById('edit-unit').value;
    
    showToast("Updating label...", "info");
    const res = await fetch(`/api/v1/business/gold-labels/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            building_type: type,
            suggested_unit_number: unit === "" ? null : unit
        })
    });
    
    if (res.ok) {
        showToast("Successfully updated!", "success");
        closeModal();
        fetchAssets();
    } else {
        showToast("Update failed", "error");
    }
}

window.addEventListener('load', fetchAssets);
</script>
{% endblock %}
